name: Release (beta)

# Déclenché par un tag "vX.Y.Z-beta.N" poussé sur la branche beta
# (ex: git tag v1.4.0-beta.1 && git push origin v1.4.0-beta.1).
#
# Artefacts produits par run : Windows (.exe NSIS, x86_64), macOS (.dmg + .pkg, arm64 et x86_64),
# Linux (.deb + .rpm + .AppImage, x86_64 et arm64). Le .pkg n'est pas un format Tauri natif : il
# est construit à la main avec pkgbuild à partir du .app généré, ni signé ni notarisé (aucun
# certificat Apple Developer configuré) — Gatekeeper avertira à l'ouverture, comme pour le .app.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: ${{ contains(github.ref_name, '-beta') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            extraArgs: ""
          - platform: macos-13
            target: x86_64-apple-darwin
            extraArgs: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extraArgs: ""
          # Pas de runner hébergé "ubuntu-22.04-arm" : on build nativement sur 24.04 arm pour
          # éviter le cross-compile (webkit2gtk et consorts sont pénibles à cross-compiler).
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extraArgs: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            extraArgs: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraire la version depuis le tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Les notes de version affichées dans l'app viennent de la même release GitHub que celle
      # créée ici : le message du tag annoté est la seule source de vérité pour les deux.
      - name: Lire les notes de version (message du tag annoté)
        id: notes
        shell: bash
        run: |
          {
            echo "notes<<EOF_NOTES"
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances système (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Fixer la version applicative depuis le tag
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build + publication de la release (préversion)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} ${{ matrix.extraArgs }} --config src-tauri/tauri.beta.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "Resonia ${{ github.ref_name }} (beta)"
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: true

      - name: Construire l'installateur .pkg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          BUNDLE_DIR="apps/client/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          APP_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app')
          PKG_PATH="$BUNDLE_DIR/Resonia_${{ steps.version.outputs.version }}_${{ matrix.target }}.pkg"
          pkgbuild --install-location /Applications --component "$APP_PATH" \
            --identifier com.resonia.client --version "${{ steps.version.outputs.version }}" "$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Publier le .pkg sur la release
        if: startsWith(matrix.platform, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.PKG_PATH }}" --clobber -R "${{ github.repository }}"

  # L'updater du canal beta pointe vers une release à tag fixe ("beta") pour ne jamais avoir à
  # changer l'URL de l'endpoint dans tauri.beta.conf.json à chaque nouvelle préversion — seul le
  # fichier latest.json y est republié à chaque run, ses URLs internes pointant vers les binaires
  # de la vraie release versionnée créée ci-dessus (immuable, jamais réécrite).
  publish-beta-pointer:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Republier latest.json sur la release pointeur "beta"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -D dl --clobber -p 'latest.json'

          if gh release view beta -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload beta dl/latest.json -R "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create beta dl/latest.json \
              -R "${GITHUB_REPOSITORY}" \
              --title "Beta (pointeur de mise à jour)" \
              --notes "Release technique : ne contient que le manifeste utilisé par l'auto-updater du canal beta. Voir la release ${GITHUB_REF_NAME} pour les notes de version." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
