# Config de packaging desktop — branchée sur le CI de release (voir .github/workflows/
# release.yml), qui l'invoque via `electron-builder --publish never` sur chaque OS puis publie
# lui-même tous les fichiers produits en une seule fois.
#
# Mêmes identifiants que l'ancien build Tauri (nom, icône, identifiant système), pour qu'un
# utilisateur migrant de l'un à l'autre retrouve la même app :
appId: com.resonia.client
productName: Resonia
# electron-builder dérive executableName du champ "name" de package.json (@resonia/client) à
# défaut de valeur explicite ici — une fois les caractères non sûrs retirés ça donne
# "@resoniaclient", rejeté par le build AppImage ("contains characters that cannot be safely
# used in file paths"). On fixe donc un nom explicite plutôt que de dépendre du nom du package.
executableName: resonia
copyright: Copyright © Resonia

# Cible `electron-updater` (voir electron/main/index.ts, update:check) sur le même dépôt de
# releases que l'ancien updater Tauri. `channel: latest` par défaut ; les releases marquées
# prerelease sur GitHub sont ce qu'`autoUpdater.allowPrerelease = true` (canal "beta", réglage
# utilisateur) va chercher — pas besoin d'un second pointeur de release à tag fixe comme
# `publish-beta-pointer` le faisait côté CI Tauri, electron-updater résout ça nativement.
publish:
  provider: github
  owner: midnights-ra1n
  repo: resonia-client

directories:
  output: dist-electron-build
  buildResources: build

# Aucun module natif (compilé) dans ce projet : main/preload/renderer sont entièrement
# pré-bundlés par electron-vite (voir externalizeDepsPlugin — zéro `require()` runtime d'un
# paquet npm en dehors d'"electron" lui-même, fourni par le runtime). L'étape @electron/rebuild
# est donc inutile ici, et plante avec `pm=pnpm` en monorepo (parcours des node_modules du
# workspace racine, buggé côté electron-builder au moment de la migration — voir la trace
# "Cannot read properties of undefined (reading 'files')" si réactivé).
npmRebuild: false

# electron-vite a déjà tout bundlé (main/preload/renderer) sans dépendance runtime externe côté
# main/preload (uniquement Node core + Electron, voir externalizeDepsPlugin dans
# electron.vite.config.ts) — inutile d'embarquer node_modules dans le paquet final.
files:
  - dist-electron/main/**
  - dist-electron/preload/**
  - dist-electron/renderer/**
  - package.json
  # `build/Resonia.icon`/`build/icon.ico` restent hors de l'asar — electron-builder les lit
  # directement depuis `buildResources` (ci-dessus) pour l'icône du BUNDLE lui-même, jamais à
  # l'exécution. `build/icon.png`, lui, EST lu à l'exécution par electron/main/index.ts
  # (icône de fenêtre/barre des tâches Windows/Linux) — sans cette ligne il manquait purement
  # et simplement de l'asar packagé, provoquant un rejet de promesse non catché au démarrage.
  - build/icon.png

mac:
  target:
    # `dmg` : installateur grand public (glisser dans /Applications). `zip` : requis par
    # electron-updater sur macOS (Squirrel.Mac ne sait s'auto-mettre à jour qu'à partir d'une
    # archive zip, jamais directement depuis un .dmg). `pkg` : conservé pour parité avec
    # l'ancien build Tauri, qui publiait aussi un .pkg construit à la main via pkgbuild —
    # electron-builder le génère nativement, plus besoin du script CI dédié.
    - target: dmg
    - target: zip
    - target: pkg
  # Icône Icon Composer (`.icon`, format « Liquid Glass » de macOS Tahoe et suivants). À partir
  # de ce seul fichier, electron-builder compile via `actool` (Xcode 26+ requis sur la machine
  # de build — voir le job macOS du workflow de release) :
  #   - Contents/Resources/Assets.car + CFBundleIconName → icône Liquid Glass (variantes
  #     claire/sombre/teintée) lue par macOS 26 Tahoe, 27 et suivants ;
  #   - Contents/Resources/icon.icns + CFBundleIconFile → icône classique, lue par les macOS
  #     antérieurs à Tahoe (qui ignorent Assets.car) — et réutilisée pour le .dmg/.pkg.
  # Chaque version de macOS choisit automatiquement celle qu'elle sait afficher. Le .icns
  # d'actool ne contient que 16 et 128 px : build/afterPack.cjs le remplace par build/icon.icns
  # (16 → 1024 px, voir scripts/build-mac-icns.sh).
  icon: build/Resonia.icon
  category: public.app-category.music
  # Arch toujours explicite dans le nom : le CI construit arm64 ET x64 dans le même appel, et
  # le nom par défaut omet "x64" (ambigu à côté du fichier arm64 sur la page de release).
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Découverte AirPlay (preuve de concept, voir electron/main/index.ts) : macOS affiche bien
  # l'invite "réseau local" sans ces clés (le socket UDP/multicast brut ouvert par notre lib
  # mDNS pure JS ne passe pas par l'API Bonjour native d'Apple, seule vraiment filtrée par
  # `NSBonjourServices`), donc ce n'est probablement pas la cause d'une découverte qui ne trouve
  # rien — mais ce sont les clés attendues par Apple pour ce genre d'usage (conformité/
  # App Store), à garder même si elles ne s'avèrent pas être le correctif du problème observé.
  extendInfo:
    NSLocalNetworkUsageDescription: >-
      Resonia a besoin d'accéder au réseau local pour découvrir les enceintes AirPlay.
    NSBonjourServices:
      - _raop._tcp
      - _airplay._tcp
  # `dir` reste utilisable en local via `electron-builder --dir` pour un `.app` non signé
  # rapide à inspecter au Finder, sans repasser par toute la matrice ci-dessus.

win:
  target:
    - target: nsis
  icon: build/icon.ico

linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: build/icons
  category: Audio
  # Explicite plutôt que dérivé de `author` (package.json) : le maintainer .deb doit rester
  # stable même si `author` change un jour pour une autre raison (branding, etc.).
  maintainer: midnights-ra1n <midnights-ra1n@users.noreply.github.com>
  # `name` (package.json) est le paquet scopé "@resonia/client" : le template par défaut de
  # nom de fichier deb/rpm l'utilise tel quel ("/" compris), ce qui fait échouer fpm en tentant
  # d'écrire dans un dossier "@resonia" inexistant. `artifactName` n'existe pas comme clé d'un
  # item de `target` (schema electron-builder : {target, arch} seulement) — il doit être défini
  # ici, au niveau linux, où il s'applique à toutes les cibles (AppImage y compris, sans risque :
  # juste un nom de fichier différent, productName au lieu du nom de package).
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Aligne le WM_CLASS Electron sur le nom du .desktop généré (déjà "resonia.desktop", dérivé
  # d'`executableName`) — sans ça, electron-builder avertit que les environnements de bureau
  # peuvent ne pas rattacher les fenêtres en cours d'exécution à cette entrée .desktop. Nécessite
  # `desktopName: "resonia.desktop"` dans apps/client/package.json (lu par app-builder-lib).
  syncDesktopName: true

# Icône du volume .dmg monté (Finder, bureau) : le .icns complet plutôt que celui d'actool.
dmg:
  icon: build/icon.icns

# Voir build/afterPack.cjs : installe l'icône .icns complète des macOS antérieurs à Tahoe.
afterPack: build/afterPack.cjs

nsis:
  # Sans espace : le nom par défaut ("Resonia Setup X.exe") est renommé en "Resonia.Setup.X.exe"
  # par GitHub à l'upload, alors que latest.yml référence "Resonia-Setup-X.exe" — l'auto-update
  # Windows casserait dès que les fichiers ne sont plus uploadés par electron-builder lui-même.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

# electron-builder ne génère aucune métadonnée AppStream pour les cibles fpm (deb/rpm) — sans
# elle, KDE Discover/GNOME Software n'ont pas de quoi construire une fiche d'app et restent
# bloqués en boucle de chargement à l'ouverture du paquet (observé avec le .rpm). `fpm` passe des
# arguments bruts à fpm ; la syntaxe SOURCE=DEST y installe ce fichier directement à
# l'emplacement système attendu. La clé n'existe PAS au niveau `linux` (le schéma la rejette et
# fait échouer electron-builder sur TOUTES les plateformes) : uniquement par cible, deb et rpm.
# Chemin relatif à apps/client (working-directory du workflow de release).
deb:
  fpm:
    - "build/com.resonia.client.metainfo.xml=/usr/share/metainfo/com.resonia.client.metainfo.xml"

rpm:
  fpm:
    - "build/com.resonia.client.metainfo.xml=/usr/share/metainfo/com.resonia.client.metainfo.xml"
