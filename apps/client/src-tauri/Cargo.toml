[package]
name = "resonia-client"
version = "1.0.0"
description = "Resonia — client Spotify-like pour Navidrome / OpenSubsonic"
edition = "2021"

[lib]
name = "resonia_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.8.3"
