name: Release (beta)

# Déclenché à chaque push sur la branche beta. La version vient de package.json (racine) : elle
# doit contenir "-beta" (ex: 1.4.0-beta.1) ; si le tag "vX.Y.Z-beta.N" correspondant existe déjà,
# rien ne se passe (push sans bump de version = pas de nouvelle release). Bump la version dans
# package.json (pnpm bump) avant de merger/push sur beta pour publier une nouvelle préversion.
#
# La release est créée en DRAFT (invisible publiquement) dès le premier build desktop terminé, et
# n'est rendue publique par publish-release qu'une fois TOUS les jobs (4 jobs desktop couvrant 5
# cibles + l'image Docker) terminés avec succès — voir ce job pour le détail. Si une seule cible
# échoue, la release reste en draft (visible seulement des collaborateurs du repo) au lieu d'être
# publiée incomplète. Un DRAFT n'a pas de tag git réel tant qu'il n'est pas publié (GitHub ne crée
# le ref qu'à la publication) : un push qui corrige un bug après un run raté relance donc bien tout
# depuis zéro (resolve-version ne voit aucun tag existant) sans laisser de tag orphelin.
#
# 4 jobs desktop et non 5 (mac / linux-x64 / linux-arm64 / win) : win empaquette x64 ET arm64
# dans le même appel electron-builder, et linux-arm64 attend explicitement linux-x64 — les deux
# évitent qu'une paire de jobs publiant en parallèle n'écrase le manifeste d'auto-update de
# l'autre (latest.yml / latest-linux.yml), voir le commentaire sur ces jobs plus bas.
#
# Canal de mise à jour : electron-updater dérive automatiquement le canal ("beta") du suffixe de
# préversion semver présent dans la version buildée (voir electron-builder.yml) — il génère
# beta.yml/beta-mac.yml/beta-linux.yml sur CETTE release (marquée prerelease ci-dessous), et le
# client desktop dont le réglage de canal est "beta" (autoUpdater.allowPrerelease = true, voir
# electron/main/index.ts) résout nativement la dernière release non-draft portant ces manifestes.
#
# Notes de version : extraites à la main depuis CHANGELOG.md (racine), pas générées
# automatiquement depuis les commits/PR (voir scripts/extract-changelog.mjs et le job
# publish-release) — mêmes notes sur la page GitHub et dans la pop-up de mise à jour de l'app,
# celle-ci lisant le corps de cette même release (voir lib/update/updateService.ts). La release
# échoue si CHANGELOG.md n'a pas de section pour cette version.
#
# Artefacts produits par run :
#   - macOS   : .dmg + .zip + .pkg, Apple Silicon (arm64) uniquement — voir le commentaire sur
#               release-mac pour pourquoi pas d'Intel.
#   - Windows : .exe NSIS, x86_64 ET arm64 (cross-packagé depuis le même runner x64).
#   - Linux   : .AppImage + .deb (Debian/Ubuntu) + .rpm, x86_64 et arm64.
#   - Docker  : image web multi-arch (linux/amd64 + linux/arm64), poussée à part sur GHCR.
# Rien n'est signé ni notarisé (aucun certificat Apple Developer / code-signing Windows
# configuré) — Gatekeeper/SmartScreen avertiront à l'ouverture.
on:
  push:
    branches:
      - beta

permissions:
  contents: write
  packages: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ne crée PAS le tag ici : il est créé par le premier appel à electron-builder --publish
      # ci-dessous, en même temps que la release (en draft). On se contente de déterminer s'il
      # existe déjà (c'est-à-dire si cette version a déjà été publiée avec succès).
      - name: Déterminer la version et si une release est nécessaire
        id: resolve
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if [[ "$VERSION" != *-beta* ]]; then
            echo "::error::package.json doit contenir une version -beta.N sur la branche beta (actuel: $VERSION)."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} déjà publié, rien à faire."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Pourquoi 4 jobs distincts plutôt qu'une seule matrice : `--publish always` télécharge le
  # manifeste d'auto-update existant sur la release (latest.yml / latest-linux.yml), y fusionne
  # l'entrée de SA cible, et le ré-upload — un simple read-modify-write, pas une opération
  # atomique côté GitHub. Deux jobs qui publient CE MÊME fichier en parallèle (ex: linux x64 et
  # linux arm64 dans une matrice) peuvent tous les deux lire l'ancienne version avant que l'autre
  # n'ait écrit la sienne : le dernier à finir écrase le travail du premier, et l'auto-update
  # casse silencieusement pour UNE des deux architectures à chaque release (bug electron-builder
  # documenté de longue date, voir issue #5592 upstream). Deux parades possibles : ne jamais
  # avoir deux jobs séparés publier le même manifeste en même temps (linux x64/arm64 ci-dessous,
  # forcées séquentielles via `needs`), ou empaqueter plusieurs arch en un seul appel
  # electron-builder qui gère lui-même la fusion en interne (windows ci-dessous — déjà sur le
  # même runner de toute façon).

  release-mac:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: macos-latest
    # Seul job à publier latest-mac.yml pour cette release : aucun risque de course.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # electron-builder télécharge le zip Electron + les toolsets NSIS/AppImage/winCodeSign/7zip
      # dans ce seul dossier (~/Library/Caches/electron-builder ici) à chaque run tant qu'il n'est
      # pas mis en cache — plusieurs dizaines de Mo re-téléchargés à l'identique à chaque release
      # sans lui. `hashFiles('pnpm-lock.yaml')` invalide le cache quand la version d'electron/
      # electron-builder change (verrouillée dans le lockfile).
      - name: Cache electron-builder (Electron, toolsets)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron-builder
          key: electron-builder-cache-macos-arm64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-cache-macos-arm64-

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Synchroniser apps/client/package.json sur la version de package.json (racine)
        run: node scripts/set-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Build (main/preload/renderer)
        run: pnpm --filter @resonia/client run electron:build

      # Apple Silicon uniquement : les runners hébergés macos-13 (Intel) sont en pénurie
      # croissante côté GitHub (fin de vie du parc Intel), avec des files d'attente parfois très
      # longues qui bloqueraient tout le flux de release — on ne construit donc plus pour
      # x86_64-apple-darwin, choix assumé plutôt qu'un oubli. CSC_IDENTITY_AUTO_DISCOVERY=false :
      # aucun certificat de signature configuré, on désactive la recherche automatique d'une
      # identité de signature plutôt que de laisser electron-builder échouer à en trouver une.
      #
      # Retry manuel en bash plutôt qu'une action tierce : l'upload des artefacts (plusieurs
      # dizaines de Mo) vers l'API GitHub Releases time out ponctuellement depuis les runners
      # hébergés (erreur réseau transitoire, pas un problème de config) — `--publish always` est
      # idempotent (ré-upload sur le même tag/release en draft), donc rejouer la commande est
      # sûr. `shell: bash` est explicite : le shell par défaut de `run:` change selon l'OS du
      # runner (pwsh sur Windows, bash sur macOS/Linux) — l'expliciter partout évite toute
      # surprise si ce fichier est un jour copié-collé vers un autre OS.
      - name: Build + publication de la release (préversion, en draft)
        working-directory: apps/client
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --publish always --mac --arm64; then
              exit 0
            fi
            echo "::warning::Tentative ${attempt}/3 échouée (probable timeout réseau), nouvel essai dans 15s..."
            sleep 15
          done
          echo "::error::Échec après 3 tentatives."
          exit 1

  release-linux-x64:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache electron-builder (Electron, toolsets)
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-cache-linux-x64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-cache-linux-x64-

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Synchroniser apps/client/package.json sur la version de package.json (racine)
        run: node scripts/set-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Build (main/preload/renderer)
        run: pnpm --filter @resonia/client run electron:build

      # AppImage + .deb (Debian/Ubuntu) + .rpm. Le nom de fichier .deb/.rpm est forcé sur
      # productName dans electron-builder.yml (linux.target[deb|rpm].artifactName) : le nom de
      # package.json est scopé ("@resonia/client"), et le template par défaut l'utilise tel
      # quel — fpm plante alors en tentant d'écrire dans un dossier "@resonia" inexistant.
      - name: Build + publication de la release (préversion, en draft)
        working-directory: apps/client
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --publish always --linux --x64; then
              exit 0
            fi
            echo "::warning::Tentative ${attempt}/3 échouée, nouvel essai dans 15s..."
            sleep 15
          done
          echo "::error::Échec après 3 tentatives."
          exit 1

  release-linux-arm64:
    # Volontairement APRÈS release-linux-x64 (jamais en parallèle) : voir le commentaire au-dessus
    # de release-mac sur la course lors de l'écriture de latest-linux.yml.
    needs: [resolve-version, release-linux-x64]
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache electron-builder (Electron, toolsets)
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-cache-linux-arm64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-cache-linux-arm64-

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Synchroniser apps/client/package.json sur la version de package.json (racine)
        run: node scripts/set-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Build (main/preload/renderer)
        run: pnpm --filter @resonia/client run electron:build

      # Pas de runner hébergé "ubuntu-22.04-arm" : on build nativement sur 24.04 arm pour éviter
      # le cross-compile.
      - name: Build + publication de la release (préversion, en draft)
        working-directory: apps/client
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --publish always --linux --arm64; then
              exit 0
            fi
            echo "::warning::Tentative ${attempt}/3 échouée, nouvel essai dans 15s..."
            sleep 15
          done
          echo "::error::Échec après 3 tentatives."
          exit 1

  release-win:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `~` se résout vers le profil du runner (équivalent à %LOCALAPPDATA%\electron-builder\Cache
      # ici) : mêmes toolsets (Electron, NSIS, winCodeSign…) qu'en local, jamais re-téléchargés
      # tant que la version verrouillée dans pnpm-lock.yaml ne change pas.
      - name: Cache electron-builder (Electron, toolsets)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-cache-windows-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-cache-windows-

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Synchroniser apps/client/package.json sur la version de package.json (racine)
        run: node scripts/set-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Build (main/preload/renderer)
        run: pnpm --filter @resonia/client run electron:build

      # x64 ET arm64 dans le MÊME appel electron-builder (donc le même job, le même runner) :
      # aucun risque de course sur latest.yml, un seul processus l'écrit une seule fois avec les
      # deux archs déjà fusionnées. Pas de runner Windows ARM hébergé de toute façon : comme il
      # n'y a aucun code natif à compiler dans ce projet, electron-builder empaquette directement
      # les binaires Electron arm64 déjà compilés depuis ce runner x64, sans toolchain
      # supplémentaire — le cross-packaging est natif à l'outil.
      #
      # `shell: bash` : le défaut de `run:` sur windows-latest est PowerShell, qui n'a pas la
      # même syntaxe de boucle/test — Git Bash est présent nativement sur les runners Windows
      # hébergés, on le force explicitement pour garder un seul script partagé entre OS.
      - name: Build + publication de la release (préversion, en draft)
        working-directory: apps/client
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --publish always --win --x64 --arm64; then
              exit 0
            fi
            echo "::warning::Tentative ${attempt}/3 échouée, nouvel essai dans 15s..."
            sleep 15
          done
          echo "::error::Échec après 3 tentatives."
          exit 1

  # Image Docker de la version web (seule plateforme sans téléchargement hors-ligne ni choix de
  # qualité audio : AAC 256 kbps forcé, cf. apps/client/src/lib/audio/qualityOptions.ts). Publiée
  # à part des binaires de bureau ci-dessus, sur GHCR, avec un tag flottant ":beta" en plus du tag
  # de version. Multi-arch (amd64 natif, arm64 émulé via QEMU — l'image est une simple build Vite
  # + nginx, l'émulation reste rapide).
  docker-web:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU (pour la cible arm64 émulée)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push de l'image web (préversion)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:beta
            ghcr.io/${{ github.repository }}-web:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ne s'exécute (par défaut, needs propage l'échec/skip) que si TOUTES les cibles de `release`
  # ET `docker-web` ont réussi : c'est le seul moment où la release, restée en draft jusqu'ici,
  # devient visible publiquement. Une cible en échec laisse la release en draft (visible des
  # seuls collaborateurs) plutôt que de publier une release avec des plateformes manquantes.
  publish-release:
    needs: [resolve-version, release-mac, release-linux-x64, release-linux-arm64, release-win, docker-web]
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Notes de version écrites à la main (CHANGELOG.md racine), pas `--generate-notes` (liste
      # brute des commits/PR GitHub, jamais éditorialisée) — voir scripts/extract-changelog.mjs.
      # Échoue la release si la section de cette version est absente/vide, plutôt que de publier
      # des notes creuses ou périmées.
      - name: Extraire les notes de version depuis CHANGELOG.md
        run: node scripts/extract-changelog.mjs "${{ needs.resolve-version.outputs.version }}" > /tmp/release-notes.md
      - name: Publier la release (toutes les cibles ont réussi)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.resolve-version.outputs.tag }}" \
            --draft=false --prerelease=true --notes-file /tmp/release-notes.md \
            --title "Resonia ${{ needs.resolve-version.outputs.tag }} (beta)" \
            -R "${{ github.repository }}"
