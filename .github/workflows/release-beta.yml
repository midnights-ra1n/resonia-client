name: Release (beta)

# Déclenché à chaque push sur la branche beta. La version vient de package.json (racine) : elle
# doit contenir "-beta" (ex: 1.4.0-beta.1) ; si le tag "vX.Y.Z-beta.N" correspondant existe déjà,
# rien ne se passe (push sans bump de version = pas de nouvelle release). Bump la version dans
# package.json (pnpm bump) avant de merger/push sur beta pour publier une nouvelle préversion.
#
# La release est créée en DRAFT (invisible publiquement) dès le premier build desktop terminé, et
# n'est rendue publique par publish-release qu'une fois TOUS les jobs (5 cibles desktop + l'image
# Docker) terminés avec succès — voir ce job pour le détail. Si une seule cible échoue, la
# release reste en draft (visible seulement des collaborateurs du repo) au lieu d'être publiée
# incomplète.
#
# Canal de mise à jour : electron-updater dérive automatiquement le canal ("beta") du suffixe de
# préversion semver présent dans la version buildée (voir electron-builder.yml) — il génère
# beta.yml/beta-mac.yml/beta-linux.yml sur CETTE release (marquée prerelease ci-dessous), et le
# client desktop dont le réglage de canal est "beta" (autoUpdater.allowPrerelease = true, voir
# electron/main/index.ts) résout nativement la dernière release non-draft portant ces manifestes
# — plus besoin d'une release "pointeur" à tag fixe comme du temps de l'updater Tauri.
#
# Notes de version : générées automatiquement par GitHub à partir des commits/PR depuis la
# dernière release (mêmes notes sur la page GitHub et dans l'app, l'app lisant le corps de cette
# même release — voir lib/update/updateService.ts).
#
# Artefacts produits par run : Windows (.exe NSIS, x86_64 ET arm64 cross-compilé), macOS (.dmg +
# .zip + .pkg, arm64 uniquement — voir le commentaire sur la matrice), Linux (.deb + .rpm +
# .AppImage, x86_64 et arm64), image Docker web multi-arch (linux/amd64 + linux/arm64). Rien
# n'est signé ni notarisé (aucun certificat Apple Developer / code-signing Windows configuré) —
# Gatekeeper/SmartScreen avertiront à l'ouverture, comme pour l'ancien build Tauri.
on:
  push:
    branches:
      - beta

permissions:
  contents: write
  packages: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ne crée PAS le tag ici : il est créé par le premier appel à electron-builder --publish
      # ci-dessous, en même temps que la release (en draft). On se contente de déterminer s'il
      # existe déjà.
      - name: Déterminer la version et si une release est nécessaire
        id: resolve
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if [[ "$VERSION" != *-beta* ]]; then
            echo "::error::package.json doit contenir une version -beta.N sur la branche beta (actuel: $VERSION)."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} déjà publié, rien à faire."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon uniquement : les runners hébergés macos-13 (Intel) sont en pénurie
          # croissante côté GitHub (fin de vie du parc Intel), avec des files d'attente parfois
          # très longues — on ne construit donc plus pour x86_64-apple-darwin.
          - platform: macos-latest
            builderArgs: "--mac --arm64"
          - platform: ubuntu-22.04
            builderArgs: "--linux --x64"
          # Pas de runner hébergé "ubuntu-22.04-arm" : on build nativement sur 24.04 arm pour
          # éviter le cross-compile.
          - platform: ubuntu-24.04-arm
            builderArgs: "--linux --arm64"
          - platform: windows-latest
            builderArgs: "--win --x64"
          # Pas de runner Windows ARM hébergé : electron-builder empaquette juste des binaires
          # déjà compilés (aucun code natif à compiler dans ce projet), le cross-packaging arm64
          # depuis un hôte x64 est donc natif à l'outil, sans toolchain supplémentaire.
          - platform: windows-latest
            builderArgs: "--win --arm64"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Synchroniser apps/client/package.json sur la version de package.json (racine)
        run: node scripts/set-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Build (main/preload/renderer)
        run: pnpm --filter @resonia/client run electron:build

      # `--publish always` crée (au premier job à terminer) ou complète la release GitHub en
      # DRAFT du tag "v<version>", marquée prerelease par electron-builder (dérivé du suffixe
      # "-beta" de la version), et y attache les artefacts de cette cible.
      - name: Build + publication de la release (préversion, en draft)
        working-directory: apps/client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --publish always ${{ matrix.builderArgs }}

  # Image Docker de la version web (seule plateforme sans téléchargement hors-ligne ni choix de
  # qualité audio : AAC 256 kbps forcé, cf. apps/client/src/lib/audio/qualityOptions.ts). Publiée
  # à part des binaires de bureau ci-dessus, sur GHCR, avec un tag flottant ":beta" en plus du tag
  # de version. Multi-arch (amd64 natif, arm64 émulé via QEMU — l'image est une simple build Vite
  # + nginx, l'émulation reste rapide).
  docker-web:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU (pour la cible arm64 émulée)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push de l'image web (préversion)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:beta
            ghcr.io/${{ github.repository }}-web:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ne s'exécute (par défaut, needs propage l'échec/skip) que si TOUTES les cibles de `release`
  # ET `docker-web` ont réussi : c'est le seul moment où la release, restée en draft jusqu'ici,
  # devient visible publiquement. Une cible en échec laisse la release en draft (visible des
  # seuls collaborateurs) plutôt que de publier une release avec des plateformes manquantes.
  publish-release:
    needs: [resolve-version, release, docker-web]
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier la release (toutes les cibles ont réussi)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.resolve-version.outputs.tag }}" \
            --draft=false --prerelease=true --generate-notes \
            --title "Resonia ${{ needs.resolve-version.outputs.tag }} (beta)" \
            -R "${{ github.repository }}"
