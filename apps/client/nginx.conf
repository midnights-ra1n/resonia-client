# SPA React Router : toute route inconnue retombe sur index.html côté client.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # index.html ne doit jamais être mis en cache : c'est lui qui référence les assets hashés,
    # sans quoi les clients resteraient bloqués sur un ancien build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets hashés par Vite (contenu dans le nom de fichier) : cache long et immuable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
