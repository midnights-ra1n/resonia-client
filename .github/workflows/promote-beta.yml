name: Promote to beta

# Déclenchement manuel : fait avancer la branche beta jusqu'à development, puis crée et pousse
# le tag "vX.Y.Z-beta.N" correspondant — ce qui déclenche automatiquement release-beta.yml.
# Le message du tag (les notes saisies ci-dessous) est la seule source de vérité des notes de
# version : elles apparaissent telles quelles sur la release GitHub ET dans l'app (voir
# release-beta.yml et lib/update/updateService.ts).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.1.0-beta.1, sans le \"v\")"
        required: true
      notes:
        description: "Notes de version"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: development

      - name: Valider le format de version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "::error::La version doit être au format X.Y.Z-beta.N (ex: 1.1.0-beta.1)"
            exit 1
          fi

      - name: Refuser un tag déjà existant
        run: |
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "::error::Le tag v${VERSION} existe déjà."
            exit 1
          fi

      - name: Configurer git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Faire avancer beta jusqu'à development
        run: git push origin development:beta

      - name: Créer et pousser le tag annoté (déclenche release-beta.yml)
        run: |
          git tag -a "v${VERSION}" -m "$NOTES"
          git push origin "v${VERSION}"
