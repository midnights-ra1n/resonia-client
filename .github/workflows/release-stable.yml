name: Release (stable)

# Déclenché par un tag "vX.Y.Z" poussé sur la branche stable (ex: git tag v1.4.0 && git push origin v1.4.0).
# Les tags "vX.Y.Z-beta.N" sont ignorés ici — voir release-beta.yml.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.ref_name, '-beta') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraire la version depuis le tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Les notes de version affichées dans l'app viennent de la même release GitHub que celle
      # créée ici : le message du tag annoté est la seule source de vérité pour les deux.
      - name: Lire les notes de version (message du tag annoté)
        id: notes
        shell: bash
        run: |
          {
            echo "notes<<EOF_NOTES"
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Le lockfile est à la racine du workspace pnpm : pnpm résout le workspace tout seul même
      # lancé depuis apps/client, mais on installe depuis la racine pour rester explicite.
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Fixer la version applicative depuis le tag
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build + publication de la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "Resonia ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
