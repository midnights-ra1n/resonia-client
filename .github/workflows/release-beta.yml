name: Release (beta)

# Déclenché à chaque push sur la branche beta. La version vient de package.json (racine) : elle
# doit contenir "-beta" (ex: 1.4.0-beta.1) ; si le tag "vX.Y.Z-beta.N" correspondant existe déjà,
# rien ne se passe (push sans bump de version = pas de nouvelle release). Bump la version dans
# package.json avant de merger/push sur beta pour publier une nouvelle préversion.
#
# Notes de version : générées automatiquement par GitHub à partir des commits/PR depuis la
# dernière release (mêmes notes sur la page GitHub et dans l'app, l'app lisant le corps de cette
# même release — voir lib/update/updateService.ts).
#
# Artefacts produits par run : Windows (.exe NSIS, x86_64), macOS (.dmg + .pkg, arm64 et x86_64),
# Linux (.deb + .rpm + .AppImage, x86_64 et arm64). Le .pkg n'est pas un format Tauri natif : il
# est construit à la main avec pkgbuild à partir du .app généré, ni signé ni notarisé (aucun
# certificat Apple Developer configuré) — Gatekeeper avertira à l'ouverture, comme pour le .app.
on:
  push:
    branches:
      - beta

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Déterminer la version et si une release est nécessaire
        id: resolve
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if [[ "$VERSION" != *-beta* ]]; then
            echo "::error::package.json doit contenir une version -beta.N sur la branche beta (actuel: $VERSION)."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} déjà publié, rien à faire."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Créer et pousser le tag
        if: steps.resolve.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.resolve.outputs.tag }}" -m "Release ${{ steps.resolve.outputs.tag }}"
          git push origin "${{ steps.resolve.outputs.tag }}"

  release:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            extraArgs: ""
          - platform: macos-13
            target: x86_64-apple-darwin
            extraArgs: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extraArgs: ""
          # Pas de runner hébergé "ubuntu-22.04-arm" : on build nativement sur 24.04 arm pour
          # éviter le cross-compile (webkit2gtk et consorts sont pénibles à cross-compiler).
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extraArgs: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            extraArgs: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances système (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Synchroniser tauri.conf.json / Cargo.toml sur la version de package.json
        run: node scripts/set-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Build + publication de la release (préversion)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} ${{ matrix.extraArgs }} --config src-tauri/tauri.beta.conf.json
          tagName: ${{ needs.resolve-version.outputs.tag }}
          releaseName: "Resonia ${{ needs.resolve-version.outputs.tag }} (beta)"
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: true

      - name: Construire l'installateur .pkg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          BUNDLE_DIR="apps/client/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          APP_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app')
          PKG_PATH="$BUNDLE_DIR/Resonia_${{ needs.resolve-version.outputs.version }}_${{ matrix.target }}.pkg"
          pkgbuild --install-location /Applications --component "$APP_PATH" \
            --identifier com.resonia.client --version "${{ needs.resolve-version.outputs.version }}" "$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Publier le .pkg sur la release
        if: startsWith(matrix.platform, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.resolve-version.outputs.tag }}" "${{ env.PKG_PATH }}" --clobber -R "${{ github.repository }}"

  # L'updater du canal beta pointe vers une release à tag fixe ("beta") pour ne jamais avoir à
  # changer l'URL de l'endpoint dans tauri.beta.conf.json à chaque nouvelle préversion — seul le
  # fichier latest.json y est republié à chaque run, ses URLs internes pointant vers les binaires
  # de la vraie release versionnée créée ci-dessus (immuable, jamais réécrite).
  publish-beta-pointer:
    needs: [resolve-version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Republier latest.json sur la release pointeur "beta"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl
          gh release download "${{ needs.resolve-version.outputs.tag }}" -R "${GITHUB_REPOSITORY}" -D dl --clobber -p 'latest.json'

          if gh release view beta -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload beta dl/latest.json -R "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create beta dl/latest.json \
              -R "${GITHUB_REPOSITORY}" \
              --title "Beta (pointeur de mise à jour)" \
              --notes "Release technique : ne contient que le manifeste utilisé par l'auto-updater du canal beta. Voir la release ${{ needs.resolve-version.outputs.tag }} pour les notes de version." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
